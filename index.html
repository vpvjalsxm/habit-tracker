<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>해빗트래커</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f5f1;--cd:#fff;--ink:#2b2f2e;--mu:#7b817e;--ac:#4f7f72;--acs:#e3eee9;--ln:#e7e5df;--wn:#c98b4a;--bd:#c46b5f;--bl:#3b78c4;--rd:#d0463b;--fl:#d9822b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#1b1e1d;--cd:#252928;--ink:#e8eae8;--mu:#97a09b;--ac:#7fb5a4;--acs:#2c3a36;--ln:#343a38;--wn:#d9a566;--bd:#d98a7e;--bl:#7aa7e0;--rd:#ef7f74;--fl:#e8a04f}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 "Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;padding-bottom:90px}
main{max-width:720px;margin:0 auto;padding:20px 16px}
h1{font-size:24px;margin:4px 0 14px}h1 small{font-size:15px;color:var(--mu);font-weight:400}h2{font-size:16px;margin:0 0 10px}
.card{background:var(--cd);border:1px solid var(--ln);border-radius:16px;padding:16px;margin-bottom:14px}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
button{font:inherit;color:inherit;cursor:pointer}
.btn{background:var(--ac);color:#fff;border:0;border-radius:12px;min-height:44px;padding:0 16px}
.btn.g{background:var(--acs);color:var(--ac)}.btn.d{background:transparent;color:var(--bd);border:1px solid var(--ln)}
.ib{background:none;border:0;min-width:44px;min-height:44px;display:grid;place-items:center;color:var(--mu);border-radius:10px}
.bar{height:8px;background:var(--ln);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--ln)}.row:first-of-type{border-top:0}
.row .t{flex:1;min-width:0}.row .t b{font-weight:500}.sub{color:var(--mu);font-size:13px}
.chk{width:44px;height:44px;border-radius:12px;border:2px solid var(--ln);background:transparent;display:grid;place-items:center;color:transparent;flex:none}
.chk.on{background:var(--ac);border-color:var(--ac);color:#fff}
.hic{width:40px;height:40px;border-radius:12px;background:var(--acs);color:var(--ac);display:grid;place-items:center;flex:none}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal .w{text-align:center;font-size:12px;color:var(--mu)}
.cd{min-height:54px;border:1px solid transparent;border-radius:10px;background:transparent;padding:3px 0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px}
.cd .i{width:11px;height:11px}.cd span{display:flex;gap:1px;color:var(--ac);min-height:11px}
.cd.full{background:var(--acs)}.cd.part{background:color-mix(in srgb,var(--wn) 22%,transparent)}.cd.miss{background:color-mix(in srgb,var(--bd) 16%,transparent)}
.cd.today b{background:var(--ac);color:#fff;border-radius:10px;padding:0 7px}.cd.sel{border-color:var(--ac)}
.hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.lg{display:flex;gap:10px;font-size:11px;color:var(--mu);margin-top:8px;flex-wrap:wrap}.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:3px;vertical-align:-1px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--cd);border-top:1px solid var(--ln);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;max-width:240px;background:none;border:0;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--mu)}nav button.on{color:var(--ac);font-weight:700}
.seg{display:inline-flex;background:var(--ln);border-radius:12px;padding:3px}.seg button{border:0;background:none;min-height:38px;padding:0 18px;border-radius:10px}.seg .on{background:var(--cd);font-weight:700}
.bars{display:flex;gap:4px;height:130px}.bc{flex:1;display:flex;flex-direction:column;align-items:center;font-size:10px;color:var(--mu);min-width:0}
.bw{flex:1;width:100%;display:flex;align-items:flex-end}.bw i{width:100%;background:var(--ac);border-radius:4px 4px 0 0;min-height:2px}.bc.f i{opacity:.3}
.hb{display:flex;align-items:center;gap:8px;margin:8px 0;font-size:13px}.hb .n{width:92px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hb .bar{flex:1}.hb em{width:56px;text-align:right;font-style:normal}
.dots{display:flex;flex-wrap:wrap;gap:3px;margin-top:8px}.dots i{width:10px;height:10px;border-radius:3px;background:var(--ln)}.dots .d{background:var(--ac)}.dots .m{background:var(--bd);opacity:.6}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid div{background:var(--bg);border-radius:12px;padding:10px;text-align:center}.grid b{display:block;font-size:20px}.grid span{font-size:12px;color:var(--mu)}
.empty{text-align:center;color:var(--mu);padding:24px 8px}
.mo{position:fixed;inset:0;background:#0007;display:flex;align-items:flex-end;justify-content:center;z-index:9}
.md{background:var(--cd);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px))}
label.f{display:block;margin:10px 0 4px;font-size:13px;color:var(--mu)}
input,select,textarea{font:inherit;width:100%;min-height:44px;padding:8px 10px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--ink)}
.ch{display:flex;flex-wrap:wrap;gap:6px}.ch label{position:relative}.ch input{position:absolute;opacity:0;width:0;min-height:0}
.ch span,.ip svg{display:grid;place-items:center;min-width:44px;min-height:44px;border:1px solid var(--ln);border-radius:10px;padding:0 8px;cursor:pointer}
.ip svg{padding:9px;width:44px;height:44px}.ch input:checked+span,.ip input:checked+svg{background:var(--acs);border-color:var(--ac);color:var(--ac)}
.er{color:var(--bd);font-size:13px;min-height:20px}.ac{display:flex;gap:8px;margin-top:12px}.ac .btn{flex:1}
#toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:20;display:none}
.gi{display:flex;align-items:center;gap:8px;min-height:40px}.gi input{width:22px;min-height:22px}
.step{display:flex;gap:6px;align-items:center;margin-top:8px}.step input{width:90px;text-align:center}.step button{min-width:44px;min-height:44px;border:1px solid var(--ln);background:none;border-radius:10px;font-size:18px}
.hic{background:color-mix(in srgb,var(--c,var(--ac)) 18%,transparent);color:color-mix(in srgb,var(--c,var(--ac)) 70%,var(--ink))}
.cal .w.sat{color:var(--bl)}.cal .w.sun{color:var(--rd)}.cd.sat b{color:var(--bl)}.cd.sun b{color:var(--rd)}.cd.today b,.cd.today.sat b,.cd.today.sun b{color:#fff}
.rr{flex-wrap:wrap;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}.rr.drag{background:var(--acs);box-shadow:0 6px 18px #0003;border-radius:12px;transform:scale(1.02);position:relative;z-index:2}
.t{cursor:pointer}.menu{flex-basis:100%;display:flex;flex-wrap:wrap;gap:6px}.menu .btn{flex:1;min-width:52px;padding:0 8px}.menu textarea{flex-basis:100%;-webkit-user-select:text;user-select:text}.menu .ac{flex-basis:100%;margin-top:0}
.fl{display:inline-flex;align-items:center;gap:1px;color:var(--mu);font-size:13px;vertical-align:1px}.fl .i{width:15px;height:15px}.fl b{display:inline-block}.fl.on{color:var(--fl)}.fl.on .i{fill:color-mix(in srgb,var(--fl) 30%,transparent)}
.fl.pop .i,.fl.pop b{animation:pop .45s ease-out}@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.4)}100%{transform:scale(1)}}
@media(prefers-reduced-motion:reduce){.fl.pop .i,.fl.pop b{animation:none}}
</style></head><body>
<main id="app"></main><nav id="nav"></nav><div id="toast"></div><div id="md"></div>
<script>
const I={home:"M3 11l9-8 9 8 M5 10v10h14V10",goal:"M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z",chart:"M4 20V10 M10 20V4 M16 20v-7 M22 20H2",check:"M5 12l5 5 9-10",plus:"M12 5v14M5 12h14",edit:"M4 20l1-4L16 5l3 3L8 19z M14 7l3 3",trash:"M4 7h16 M9 7V4h6v3 M6 7l1 13h10l1-13",left:"M15 5l-7 7 7 7",right:"M9 5l7 7-7 7",
cup:"M6 3h12l-1.5 17a1 1 0 0 1-1 1h-8a1 1 0 0 1-1-1z M7 9h10",drop:"M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z",bed:"M3 18V6 M3 14h18v4 M21 14v-2a3 3 0 0 0-3-3h-7v5",shower:"M8 8a4 4 0 0 1 8 0 M5 8h14 M8 12v1 M12 12v3 M16 12v1 M8 17v1 M16 17v1 M12 19v1",book:"M4 19V5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0 0 4h13",pencil:"M4 20l1-4L16 5l3 3L8 19z M14 7l3 3",desk:"M3 8h18 M5 8v12 M19 8v12 M5 14h14",shoe:"M3 17h18v2H3z M3 17v-6l4-1 3 3h4l4 2v2",stretch:"M12 3.5a1.5 1.5 0 1 0 .01 0 M12 7v6 M5 9l7 2 7-2 M12 13l-4 7 M12 13l4 7",clock:"M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z M12 7v5l3 2",box:"M3 7h18v4H3z M5 11v9h14v-9 M10 15h4",heart:"M12 20s-7-4.5-7-10a4 4 0 0 1 7-2 4 4 0 0 1 7 2c0 5.5-7 10-7 10z",flame:"M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.4-.5-2-1-3-1.1-2.1-.2-4.1 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.2.4-2.3 1-3a2.5 2.5 0 0 0 2.5 2.5z"};
const IL={cup:'물컵',drop:'물방울',bed:'침대',shower:'샤워',book:'책',pencil:'연필',desk:'책상',shoe:'운동화',stretch:'스트레칭',clock:'시계',box:'정리함',heart:'하트'};
const ic=(n,c='')=>`<svg class="i ${c}" viewBox="0 0 24 24"><path d="${I[n]||I.heart}"/></svg>`;
const DEFC=[{id:'공부',name:'공부',color:'#6b8fb5'},{id:'건강',name:'건강',color:'#5f9a7e'},{id:'수면',name:'수면',color:'#8b7fb8'},{id:'독서',name:'독서',color:'#c08a5b'},{id:'생활 관리',name:'생활 관리',color:'#5aa0a0'},{id:'기타',name:'기타',color:'#8c928f'}],DN=['일','월','화','수','목','금','토'];
/* 공휴일 목록(관리용): 2026·2027년. 2028년 이후는 여기에 추가 */
const HOL={};[['2026','01-01 신정,02-16 설날연휴,02-17 설날,02-18 설날연휴,03-01 삼일절,03-02 대체공휴일,05-01 노동절,05-05 어린이날,05-24 부처님오신날,05-25 대체공휴일,06-03 지방선거일,06-06 현충일,07-17 제헌절,08-15 광복절,08-17 대체공휴일,09-24 추석연휴,09-25 추석,09-26 추석연휴,10-03 개천절,10-05 대체공휴일,10-09 한글날,12-25 성탄절'],['2027','01-01 신정,02-06 설날연휴,02-07 설날,02-08 설날연휴,02-09 대체공휴일,03-01 삼일절,05-01 노동절,05-03 대체공휴일,05-05 어린이날,05-13 부처님오신날,06-06 현충일,07-17 제헌절,07-19 대체공휴일,08-15 광복절,08-16 대체공휴일,09-14 추석연휴,09-15 추석,09-16 추석연휴,10-03 개천절,10-04 대체공휴일,10-09 한글날,10-11 대체공휴일,12-25 성탄절,12-27 대체공휴일']].forEach(([y,s])=>s.split(',').forEach(x=>{const[a,b]=x.split(' ');HOL[y+'-'+a]=b}));
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEY='habit-tracker-v1';let S={habits:[],logs:{},goals:[]};
try{S=Object.assign(S,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
function fixS(){if(!Array.isArray(S.cats)||!S.cats.length)S.cats=DEFC.map(c=>({...c}));if(!S.cats.find(c=>c.id=='기타'))S.cats.push({id:'기타',name:'기타',color:'#8c928f'});if(!S.notes)S.notes={};S.habits.forEach(h=>{if(!S.cats.find(c=>c.id==h.cat))h.cat='기타'})}fixS();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));return true}catch(e){toast('저장에 실패했어요. 브라우저 저장 공간/시크릿 모드를 확인해 주세요.');return false}}
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',2800)}
/* 날짜 (로컬 시간) */
const pad=n=>String(n).padStart(2,'0'),ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const add=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ymd(d)};
const today=()=>ymd(new Date()),wk=s=>add(s,-((pd(s).getDay()+6)%7)),mo=s=>s.slice(0,7)+'-01';
const monthEnd=s=>{const d=pd(s);return ymd(new Date(d.getFullYear(),d.getMonth()+1,0))};
const shiftM=(s,n)=>{const d=pd(s);return ymd(new Date(d.getFullYear(),d.getMonth()+n,1))};
const md=s=>{const d=pd(s);return (d.getMonth()+1)+'/'+d.getDate()};
/* 습관 로직: mode = daily | days | weekly | monthly (확장하려면 sch/pk/pe에 규칙 추가) */
const isC=h=>h.mode=='weekly'||h.mode=='monthly',unit=h=>h.mode=='weekly'?'주':h.mode=='monthly'?'개월':'일';
const act=(h,d)=>d>=h.start&&(!h.end||d<=h.end);
const sch=(h,d)=>act(h,d)&&(h.mode=='daily'||isC(h)||(h.mode=='days'&&h.days.includes(pd(d).getDay())));
const dn=(h,d)=>!!(S.logs[d]&&S.logs[d][h.id]);
const pk=(h,d)=>h.mode=='weekly'?wk(d):mo(d),pe=(h,k)=>h.mode=='weekly'?add(k,6):monthEnd(k);
const cnt=(h,k)=>{let n=0;for(let x=k,e=pe(h,k);x<=e;x=add(x,1))if(dn(h,x))n++;return n};
const modeL=h=>h.mode=='daily'?'매일':h.mode=='days'?[...h.days].sort((a,b)=>(a+6)%7-(b+6)%7).map(i=>DN[i]).join('·'):(h.mode=='weekly'?'주 ':'월 ')+h.count+'회';
function stat(h,from,to){const t=today();let a=from<h.start?h.start:from,b=to>t?t:to;if(h.end&&b>h.end)b=h.end;
 if(a>b)return{p:0,c:0,r:null};let p=0,c=0,ong=false;
 if(!isC(h)){for(let d=a;d<=b;d=add(d,1))if(sch(h,d)){p++;if(dn(h,d))c++}}
 else{const seen={};for(let d=a;d<=b;d=add(d,1)){const k=pk(h,d);if(seen[k])continue;seen[k]=1;p+=h.count;c+=Math.min(cnt(h,k),h.count);if(pe(h,k)>=t)ong=true}
  if(ong&&c==0)return{p:0,c:0,r:null}}
 return{p,c,r:p?Math.round(c/p*100):null}}
function streak(h){const t=today();let run=0,best=0;
 if(!isC(h)){for(let d=h.start;d<=t&&(!h.end||d<=h.end);d=add(d,1)){if(!sch(h,d))continue;if(dn(h,d)){run++;best=Math.max(best,run)}else if(d!==t)run=0}}
 else{for(let k=pk(h,h.start),g=0;k<=t&&g<2000;g++,k=h.mode=='weekly'?add(k,7):add(pe(h,k),1)){if(cnt(h,k)>=h.count){run++;best=Math.max(best,run)}else if(pe(h,k)<t)run=0}}
 return{cur:run,best}}
const dayList=d=>S.habits.filter(h=>sch(h,d));
function dstat(d){const t=today();if(d>t)return'';const R=S.habits.filter(h=>!isC(h)&&sch(h,d)),D=S.habits.filter(h=>dn(h,d));
 if(!R.length&&!D.length)return'';return R.every(h=>dn(h,d))?'full':D.length?'part':'miss'}
/* 상태 */
let tab='home',sel=today(),vm=mo(today()),gt='w',go=0,sm='w',so=0,menuId=null,memoOpen=false,animId=null;
const cat=h=>S.cats.find(c=>c.id==h.cat)||S.cats[S.cats.length-1];
function row(h,d){const s=streak(h),k=pk(h,d),c=cat(h),note=S.notes[d+'|'+h.id],extra=isC(h)?` · ${h.mode=='weekly'?'이번 주':'이번 달'} ${cnt(h,k)}/${h.count}회`:'';
 return `<div class="row rr" data-id="${h.id}"><div class="hic" style="--c:${c.color}">${ic(h.icon)}</div><div class="t" data-a="menu" data-v="${h.id}"><b>${esc(h.name)}</b> <span class="fl ${s.cur?'on':''} ${animId==h.id?'pop':''}" title="현재 연속 ${s.cur}">${ic('flame')}<b>${s.cur}</b></span><div class="sub"><span style="color:color-mix(in srgb,${c.color} 70%,var(--ink))">${esc(c.name)}</span> · ${modeL(h)}${h.amount?' · '+esc(h.amount):''}${extra}</div>${note?`<div class="sub">${esc(note)}</div>`:''}</div><button class="chk ${dn(h,d)?'on':''}" data-a="tog" data-v="${h.id}" aria-label="완료">${ic('check')}</button>${menuId==h.id?menuHtml(h,d):''}</div>`}
const menuHtml=(h,d)=>`<div class="menu">${memoOpen?`<textarea id="mt" maxlength="120" rows="2" placeholder="${md(d)} 메모">${esc(S.notes[d+'|'+h.id]||'')}</textarea><div class="ac"><button class="btn g" data-a="menu" data-v="">취소</button><button class="btn" data-a="saveN" data-v="${h.id}">저장</button></div>`:`<button class="btn g" data-a="editH" data-v="${h.id}">수정</button><button class="btn d" data-a="delH" data-v="${h.id}">삭제</button><button class="btn g" data-a="memo">메모</button><button class="btn g" data-a="mv" data-v="${h.id}" data-n="-1" aria-label="위로">↑</button><button class="btn g" data-a="mv" data-v="${h.id}" data-n="1" aria-label="아래로">↓</button>`}</div>`;
